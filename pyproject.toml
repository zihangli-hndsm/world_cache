[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcache"
version = "0.1.0"
description = "Viewpoint-aware persistent computation reuse experiments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9,<3.10"

[project.optional-dependencies]
test = ["pytest"]
vision = ["torch", "torchvision", "timm>=1.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
