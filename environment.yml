name: worldcache
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - numpy<2
  - scipy
  - pandas
  - pyarrow
  - pyyaml
  - pytest
  - matplotlib
  - seaborn
  - pillow=10.4.0
  - imageio-ffmpeg
  - tqdm
  - einops
  - safetensors
  - habitat-sim=0.3.3=py3.9_headless_bullet_linux_acbe6f4922e68145e401e55c30f9dfea460a3f24
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - torchvision==0.20.1+cu124
      - timm>=1.0,<2
      - hydra-core>=1.3,<2
      - rich>=13,<15
